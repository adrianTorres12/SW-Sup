<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Teacher - TOEIC Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="sidebar">
    <h2>Teacher Panel</h2>
    <a href="#">📚 Prácticas</a>
    <a href="#">➕ Crear práctica</a>
    <a href="#">👨‍🎓 Estudiantes</a>
    <a href="#">📊 Resultados</a>
    <a href="#">⚙️ Configuración</a>
  </div>

  <div class="content">
    <h1 class="mb-4">TOEIC Dashboard</h1>

    <button class="btn btn-main mb-4">+ Nueva práctica</button>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-3 shadow">
          <h5>Practice 1: Introductions</h5>
          <p class="text-muted">6 secciones • Última edición hace 3 días</p>
          <button class="btn btn-sm btn-main">Editar</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3 shadow">
          <h5>Practice 2: Pictures</h5>
          <p class="text-muted">4 secciones • Última edición ayer</p>
          <button class="btn btn-sm btn-main">Editar</button>
        </div>
      </div>
    </div>
  </div>


</body>
</html>
