<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Practice</title>
    <link rel="stylesheet" href="create.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="sidebar">
        <h2>Teacher Panel</h2>
        <a href="#">📚 Practices</a>
        <a href="#">➕ Create Practices</a>
        <a href="#">👨‍🎓 Students</a>
        <a href="#">📊 Results</a>
        <a href="#">⚙️ Settings</a>
    </div>
    <div class="content">
        <h1 style="color: #20419a" class="mb-4">TOEIC Dashboard</h1>
        <form action="">
            <h2>Create a practice</h2>
            <div class="mb-3">
                <label for="formFile" class="form-label">Part 1 - Read a text aloud</label>
                <textarea class="form-control" id="Textarea1" rows="3" placeholder="First Paragraph"></textarea>
            </div>
            <div class="mb-3">
                <textarea class="form-control" id="Textarea2" rows="3" placeholder="Second Paragraph"></textarea>
            </div>

            <div class="mb-3">
                <label for="formFileMultiple" class="form-label">Part 2 - Describe a picture</label>
                <input class="form-control" type="file" id="pic1">
            </div>
            <div class="mb-3">
                <input class="form-control" type="file" id="pic2">
            </div>

            <div class="mb-3">
                <label for="formFileMultiple" class="form-label">Part 3 - Respond to questions</label>
                <input class="form-control" type="file" id="audioP3" placeholder="Question 1" multiple>
            </div>
            <div class="mb-3">
                <input class="form-control" type="text" id="indiP3" placeholder="Directions" multiple>
            </div>
            <div class="mb-3">
                <input class="form-control" type="text" id="quest1" placeholder="Question 1" multiple>
            </div>
            <div class="mb-3">
                <input class="form-control" type="text" id="quest2" placeholder="Question 2" multiple>
            </div>
            <div class="mb-3">
                <input class="form-control" type="text" id="quest3" placeholder="Question 3" multiple>
            </div>

            <div class="mb-3">
                <label for="formFileMultiple" class="form-label">Part 3 - Respond to questions using information provided</label>
                <input class="form-control" type="text" id="quest1" placeholder="Question 1" multiple>
            </div>

        </form>
    </div>
</body>
</html>
