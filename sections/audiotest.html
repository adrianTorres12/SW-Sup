<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&W</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="audiotest.css">
</head>
<body>
    <nav class="navbar bg-white" id="nav">
        <div class="container-fluid">
            <img src="../img/ets.webp" class="img-fluid rounded float-start" alt="ets" id="ets">
            <div class="volumen-control">
                <label for="volumen">Volumen:</label>
                <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>
    </nav> 
    <div id="container"> 

        <div id="txt">
            <p>Imagine an organization that is doing a survey about different cities in the world; and you accept an interview by a phone called.</p>
            <p>Could you describe your city?</p>
            <div id="counter"><p id="seconds">00:15</p></div>
        </div>
        
        <audio id="miAudio" src="../audio/audio.mp3" autoplay></audio>
        <audio id="ultimaGrabacion" controls></audio>

    </div>
    
    <div class="foot">
        <a href=""><img src="../img/arrow.png" id="continue" alt=""></a>
    </div>
    

    <script>
    const audio = document.getElementById("miAudio");
    const controlVolumen = document.getElementById("volumen");
    const ultimaGrabacion = document.getElementById("ultimaGrabacion");
    const DURACION = 15;

    // Ajustar volumen con el slider
    controlVolumen.addEventListener("input", () => {
      audio.volume = controlVolumen.value;
    });

    function cargarUltimaGrabacion(){
    ultimaGrabacion.src = "../php/obtener_audio.php";
    }
    cargarUltimaGrabacion();

    let time = 15;
    let intervalo = null;
    const cont = document.getElementById("seconds");

     function formatoTiempo(segundos) {
        const minutos = Math.floor(segundos / 60);
        const seg = segundos % 60;
        return `${String(minutos).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
      }

    audio.addEventListener("ended", async () => {
    let time = DURACION;
    cont.textContent = formatoTiempo(time);

    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch(err){
        alert("No se pudo acceder al micrófono: " + err);
        return;
    }

    const mediaRecorder = new MediaRecorder(stream);
    const chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.start();

    const intervalo = setInterval(()=>{
        time--;
        cont.textContent = formatoTiempo(time);
        if(time<=0) clearInterval(intervalo);
    }, 1000);

    setTimeout(() => {
        mediaRecorder.stop();
    }, DURACION*1000);

    mediaRecorder.onstop = async () => {
        const blob = new Blob(chunks, { type:'audio/webm' });
        const formData = new FormData();
        formData.append('audio', blob, 'grabacion_'+Date.now()+'.webm');

        try{
            const res = await fetch('../php/subir_audio.php', { method:'POST', body:formData });
            const text = await res.text();
            console.log(text);

            cargarUltimaGrabacion();
        } catch(err){
            console.error("Error subiendo audio:", err);
        }
    };
});
  </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
