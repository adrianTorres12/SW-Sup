<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&W</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="audiotest.css">
</head>
<body>
    <nav class="navbar bg-white" id="nav">
        <div class="container-fluid">
            <img src="../img/ets.webp" class="img-fluid rounded float-start" alt="ets" id="ets">
            <div class="volumen-control">
                <label for="volumen">Volume:</label>
                <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>
    </nav> 
    
    <div id="container"> 
        <!-- <div id="popup">
            <button id="start">Start</button>
        </div> -->
        <div id="txt">
            <p id="maintxt">Imagine that an organization is conducting a global survey about cities around the world, and you have agreed to participate in a phone interview.</p>
            <p>Could you briefly describe the city where you live?</p>
            <div id="counter"><p id="seconds">00:03</p></div>
        </div>
        
        <audio id="miAudio" src="../audio/testaudio.mp3" autoplay></audio>
        <audio id="beep" src="../audio/Beep.mp3"></audio>
        <audio id="ultimaGrabacion" controls></audio>

    </div>
    
    <footer class="foot">
        <a href=""><img src="../img/arrow.png" id="continue" alt=""></a>
    </footer>
    

<script src="../js/audiotest.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
