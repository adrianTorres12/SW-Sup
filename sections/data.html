<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data | S&W </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="data.css">
</head>
<body>
    <div class="">
        <nav class="navbar bg-white" id="nav">
            <div class="container-fluid">
                <img src="../img/ets.webp" class="img-fluid rounded float-start" alt="ets" id="ets">
            </div>
        </nav>

        <form id="formInfo" class="col-11" method="post">
            <div class="row justify-content-center ">
                <div class="col-10">
                    <label for="exampleInputEmail1" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="iText" name="first">
                </div>
                <div class="col-10">
                    <label for="exampleInputEmail1" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="iText" name="last">
                </div>
                <div class="col-10">
                    <label for="exampleInputEmail1" class="form-label">Student ID</label>
                    <input type="text" class="form-control" id="iText" name="id">
                </div>
                <div class="col-10">
                    <label for="exampleInputEmail1" class="form-label">Birthday</label>
                    <input type="date" class="form-control" id="iText" name="birth">
                </div>
                <div class="col-10">
                    <label for="exampleInputEmail1" class="form-label">Country</label>
                    <select type="text" class="form-control" id="iText" name="country"> 
                        <option value="">Choose a country</option>
                        <option value="El Salvador">El Salvador</option>
                    </select>
                </div>
                <div class="col-10">
                    <label for="exampleInputEmail1" class="form-label">Language</label>
                    <select type="text" class="form-control" id="iText" name="language"> 
                        <option value="">Choose a language</option>
                        <option value="Spanish">Spanish</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success col-3" id="submit" name="insert">Save</button>
            </div>
        </form>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="../js/data.js"></script>
</body>
</html>
